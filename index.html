<body>
    <script>
        function compare(a, b)
        {
            if (a <b)
            {
               return -1;
            }
            if (a > b)
            {
               return 1;
            }  
        }
        console.log(compare(5, 10));
        console.log(compare(10, 5));
        console.log(compare(2, 2));
    </script>
