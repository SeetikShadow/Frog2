<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fct(x)
        {
          if( x === 0 || x === 1)
          {
            return 1;
            let res = 1;
          }
          for(let i = 2; i <= x; i++)
          {
            res *= i;
          }
          return res;
        }
        console.log(fct(5));
    </script>
</body>
</html>
